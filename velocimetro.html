<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper City - Velocímetro CEF</title>
    <!-- Importando fontes modernas e ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: transparent; /* Importante para o CEF ficar transparente no jogo */
            font-family: 'Montserrat', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Container principal posicionado exatamente na área vermelha */
        #speedo-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 85px;
            background: linear-gradient(135deg, rgba(15, 20, 28, 0.93) 0%, rgba(22, 28, 38, 0.95) 100%);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            transition: all 0.3s ease;
            opacity: 0; /* Começa oculto, aparece quando o player entra no carro */
        }

        /* Parte Esquerda: Nome do Carro e Combustível */
        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 32%;
        }

        .vehicle-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fuel-container {
            width: 100%;
        }

        .fuel-label {
            display: flex;
            justify-content: space-between;
            color: #a0aec0;
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .fuel-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .fuel-bar-fill {
            width: 100%; /* Dinâmico via JS */
            height: 100%;
            background: linear-gradient(90deg, #0072ff, #00d2ff);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.7);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* Parte Central: Velocidade Digital */
        .center-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 36%;
            position: relative;
        }

        .speed-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 700;
            color: #00d2ff;
            line-height: 38px;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .speed-unit {
            font-size: 10px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 2px;
            opacity: 0.8;
        }

        /* Parte Direita: Luzes de Status (Motor, Farol, Trava) */
        .right-section {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 28%;
        }

        .status-icon {
            font-size: 18px;
            color: #4a5568; /* Cor quando desligado */
            transition: all 0.3s ease;
            text-shadow: 0 0 0px transparent;
        }

        /* Classes ativas para os ícones */
        .status-icon.active-engine {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .status-icon.active-lights {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .status-icon.active-locked {
            color: #ff3838;
            text-shadow: 0 0 10px rgba(255, 56, 56, 0.5);
        }
    </style>
</head>
<body>

    <!-- Estrutura do Velocímetro -->
    <div id="speedo-container">
        
        <!-- Esquerda: Nome e Combustível -->
        <div class="left-section">
            <div class="vehicle-name" id="car-name">Infernus</div>
            <div class="fuel-container">
                <div class="fuel-label">
                    <span><i class="fa-solid fa-gas-pump"></i> COMBUSTÍVEL</span>
                    <span id="fuel-text">100%</span>
                </div>
                <div class="fuel-bar-bg">
                    <div class="fuel-bar-fill" id="fuel-bar"></div>
                </div>
            </div>
        </div>

        <!-- Centro: Velocidade -->
        <div class="center-section">
            <div class="speed-value" id="speed-num">000</div>
            <div class="speed-unit">KM/H</div>
        </div>

        <!-- Direita: Indicadores de Status -->
        <div class="right-section">
            <!-- Motor -->
            <i class="fa-solid fa-key status-icon" id="icon-engine" title="Motor"></i>
            <!-- Farol -->
            <i class="fa-solid fa-lightbulb status-icon" id="icon-lights" title="Faróis"></i>
            <!-- Trava -->
            <i class="fa-solid fa-lock status-icon" id="icon-lock" title="Tranca"></i>
        </div>

    </div>

    <!-- Script de Integração com o Servidor (Pawn) -->
    <script>
        // Função principal que seu script Pawn vai chamar para atualizar tudo de uma vez
        function updateSpeedometer(speed, fuel, name, engine, lights, locked, visible) {
            const container = document.getElementById('speedo-container');
            
            // Controle de visibilidade do velocímetro
            if (visible === 1) {
                container.style.opacity = "1";
            } else {
                container.style.opacity = "0";
                return; // Se não for pra mostrar, para a execução aqui
            }

            // Atualiza a velocidade formatando com zeros à esquerda (Ex: 007, 085, 120)
            let formattedSpeed = String(speed).padStart(3, '0');
            document.getElementById('speed-num').innerText = formattedSpeed;

            // Atualiza o Combustível
            document.getElementById('fuel-text').innerText = fuel + "%";
            document.getElementById('fuel-bar').style.width = fuel + "%";

            // Mudar cor do combustível se estiver criticamente baixo (menos de 20%)
            if(fuel <= 20) {
                document.getElementById('fuel-bar').style.background = "linear-gradient(90deg, #ff0844, #ffb199)";
            } else {
                document.getElementById('fuel-bar').style.background = "linear-gradient(90deg, #0072ff, #00d2ff)";
            }

            // Atualiza o nome do veículo
            document.getElementById('car-name').innerText = name;

            // Ícone do Motor (1 = Ligado, 0 = Desligado)
            const engineIcon = document.getElementById('icon-engine');
            if (engine === 1) {
                engineIcon.classList.add('active-engine');
            } else {
                engineIcon.classList.remove('active-engine');
            }

            // Ícone dos Faróis (1 = Ligado, 0 = Desligado)
            const lightsIcon = document.getElementById('icon-lights');
            if (lights === 1) {
                lightsIcon.classList.add('active-lights');
            } else {
                lightsIcon.classList.remove('active-lights');
            }

            // Ícone da Tranca (1 = Trancado, 0 = Destrancado)
            const lockIcon = document.getElementById('icon-lock');
            if (locked === 1) {
                lockIcon.classList.add('active-locked');
                lockIcon.classList.remove('fa-lock-open');
                lockIcon.classList.add('fa-lock');
            } else {
                lockIcon.classList.remove('active-locked');
                lockIcon.classList.remove('fa-lock');
                lockIcon.classList.add('fa-lock-open');
            }
        }

        // Teste básico para você ver como fica no navegador (apague ou comente antes de colocar no servidor)
        // Parâmetros: (velocidade, combustivel, nome, motor, farol, tranca, visivel)
        setTimeout(() => {
            updateSpeedometer(125, 78, "Infernus", 1, 1, 0, 1);
        }, 1000);
    </script>
    <script>
        setTimeout(() => 
        {
            updateSpeedometer(125, 78, "Infernus", 1, 1, 0, 1); }, 1000);
        window.cef.on('updateSpeedometer', (speed, fuel, name, engine, lights, locked, visible) => {
            updateSpeedometer(speed, fuel, name, engine, lights, locked, visible);
        });
    </script> 
</body>
</html>
